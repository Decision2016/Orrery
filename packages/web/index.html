<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Restore the canvas color before the stylesheet and React bundle paint.
      try {
        if (localStorage.getItem('orrery.theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
    <title>Orrery · Agent Observatory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
